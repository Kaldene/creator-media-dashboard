<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chief Media Dashboard</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --success-hover: #059669;
            --warning: #F59E0B;
            --warning-hover: #D97706;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --secondary: #6B7280;
            --secondary-hover: #4B5563;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        h2, h3 { margin-top: 0; color: #111827; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .row { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .row > * { flex: 1; }

        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1;
            min-width: fit-content;
        }
        button:hover { background-color: var(--primary-hover); }
        button.success { background-color: var(--success); }
        button.success:hover { background-color: var(--success-hover); }
        button.warning { background-color: var(--warning); }
        button.warning:hover { background-color: var(--warning-hover); }
        button.danger { background-color: var(--danger); }
        button.danger:hover { background-color: var(--danger-hover); }
        button.secondary { background-color: var(--secondary); }
        button.secondary:hover { background-color: var(--secondary-hover); }
        button.full-width { width: 100%; margin-bottom: 1rem; }

        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; }
        .tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-weight: 600;
            color: var(--secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        pre {
            background-color: #1F2937;
            color: #10B981;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 400px;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        .loading { display: none; color: var(--secondary); font-size: 0.9rem; margin-top: 0.5rem; }
        .loading::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
    </style>
</head>
<body>

    <div class="container">
        <!-- БЛОК АВТОРИЗАЦИИ -->
        <div class="card">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Вход</div>
                <div class="tab" onclick="switchTab('register')">Регистрация</div>
            </div>

            <!-- Форма логина -->
            <div id="login-tab" class="tab-content active">
                <div class="row">
                    <div class="form-group">
                        <label>Имя пользователя (Username)</label>
                        <input type="text" id="loginUsername" placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="loginPassword" placeholder="••••••••">
                    </div>
                </div>
                <button class="success" onclick="login()">Войти</button>
                <div class="loading" id="loading-login">Выполняется вход</div>
            </div>

            <!-- Форма регистрации -->
            <div id="register-tab" class="tab-content">
                <div class="row">
                    <div class="form-group">
                        <label>Имя пользователя</label>
                        <input type="text" id="regUsername" placeholder="Например: admin">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" placeholder="admin@example.com">
                    </div>
                    <div class="form-group">
                        <label>Пароль</label>
                        <input type="password" id="regPassword" placeholder="••••••••">
                    </div>
                </div>
                <button class="success" onclick="register()">Зарегистрироваться</button>
                <div class="loading" id="loading-reg">Создание аккаунта</div>
            </div>

            <div class="form-group" style="margin-top: 1.5rem;">
                <label>Текущий Bearer Token</label>
                <input type="text" id="token" readonly style="background: #F9FAFB; color: #6B7280;" placeholder="Токен появится здесь после входа...">
            </div>
        </div>

        <!-- БЛОК СКАЧИВАНИЯ И МАГИИ -->
        <div class="card">
            <h3>📥 Загрузка медиа (yt-dlp)</h3>
            <div class="form-group">
                <label>Ссылка на YouTube / TikTok</label>
                <input type="text" id="url" placeholder="https://youtu.be/...">
            </div>
            <div class="btn-group">
                <button class="secondary" onclick="sendRequest('/api/media/metadata', 'url')">Метаданные</button>
                <button onclick="sendRequest('/api/media/download/video', 'url')">Скачать Видео</button>
                <button onclick="sendRequest('/api/media/download/audio', 'url')">Скачать Аудио</button>
                <button class="success" onclick="sendRequest('/api/media/process/audio-to-text', 'url')">✨ Магия (Аудио + Whisper)</button>
            </div>
            <div class="loading" id="loading-dl">Обработка запроса...</div>
        </div>

        <!-- БЛОК УПРАВЛЕНИЯ И ПЛЕЕРА -->
        <div class="card">
            <h3>🎬 Управление файлами и Воспроизведение</h3>

            <button class="secondary full-width" onclick="getHistory()">📜 Показать мою историю файлов</button>

            <div class="row">
                <div class="form-group">
                    <label>Тип медиа</label>
                    <select id="mediaType">
                        <option value="video">Видео (video_items)</option>
                        <option value="audio" selected>Аудио (audio_items)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ID файла</label>
                    <input type="number" id="mediaId" placeholder="Например: 1">
                </div>
            </div>

            <div class="btn-group">
                <button class="success" onclick="loadMedia()">▶️ Смотреть / Слушать</button>
                <button class="primary" onclick="generateSubtitles()">Сгенерировать .srt</button>
                <button class="warning" onclick="downloadSubtitles()">⬇️ Скачать .srt</button>
                <button class="danger" onclick="deleteMedia()">🗑️ Удалить навсегда</button>
            </div>

            <div class="loading" id="loading-wh">Загрузка...</div>

            <video id="player" controls style="width: 100%; display: none; border-radius: 8px; margin-top: 1.5rem; background: #000;"></video>
        </div>

        <!-- БЛОК КОНСОЛИ -->
        <div class="card">
            <h3>💻 Ответ сервера</h3>
            <pre id="responseOutput">Ожидание действий...</pre>
        </div>
    </div>

    <script>
        // --- УТИЛИТЫ ---
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-tab').classList.add('active');
            }
        }

        function showOutput(data) {
            document.getElementById('responseOutput').textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        async function apiCall(endpoint, method = 'GET', body = null) {
            const token = document.getElementById('token').value;
            if (!token) throw new Error("Сначала войдите в систему!");

            const headers = { 'Authorization': `Bearer ${token}` };
            if (body) headers['Content-Type'] = 'application/json';

            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);

            const res = await fetch(endpoint, options);
            if (!res.ok) {
                const err = await res.json();
                throw new Error(JSON.stringify(err, null, 2));
            }
            return res;
        }

        // --- АВТОРИЗАЦИЯ ---
        async function register() {
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const loader = document.getElementById('loading-reg');

            loader.style.display = 'block';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(JSON.stringify(data, null, 2));

                showOutput("Успешная регистрация! Теперь вы можете войти.\n\n" + JSON.stringify(data, null, 2));
                switchTab('login');
            } catch (error) {
                showOutput("Ошибка регистрации:\n" + error.message);
            } finally { loader.style.display = 'none'; }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const loader = document.getElementById('loading-login');

            loader.style.display = 'block';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'username': username, 'password': password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(JSON.stringify(data, null, 2));

                document.getElementById('token').value = data.access_token;
                showOutput("Успешный вход! Токен установлен.");
            } catch (error) {
                showOutput("Ошибка входа:\n" + error.message);
            } finally { loader.style.display = 'none'; }
        }

        // --- СКАЧИВАНИЕ И МАГИЯ ---
        async function sendRequest(endpoint, inputId) {
            const url = document.getElementById(inputId).value;
            const loader = document.getElementById('loading-dl');

            if(!url) return alert("Введите ссылку!");
            loader.style.display = 'block';
            showOutput("Выполнение операции (это может занять время)...");

            try {
                const res = await apiCall(endpoint, 'POST', { url });
                showOutput(await res.json());
            } catch (error) {
                showOutput("Ошибка:\n" + error.message);
            } finally { loader.style.display = 'none'; }
        }

        // --- ИСТОРИЯ ФАЙЛОВ ---
        async function getHistory() {
            showOutput("Загрузка истории...");
            try {
                const res = await apiCall('/api/media/history', 'GET');
                const data = await res.json();

                if (!data.history || data.history.length === 0) {
                    return showOutput("Ваша история пуста. Скачайте что-нибудь!");
                }

                let outputText = "=== ВАШИ ФАЙЛЫ ===\n\n";
                data.history.forEach(item => {
                    const date = new Date(item.created_at).toLocaleString('ru-RU');
                    const subs = item.has_subtitles ? "[+ Субтитры]" : "[- Нет субтитров]";
                    outputText += `ID: ${item.id} | Тип: ${item.type.toUpperCase()} | ${subs}\n`;
                    outputText += `Название: ${item.title}\n`;
                    outputText += `Добавлено: ${date}\n`;
                    outputText += `------------------------\n`;
                });
                showOutput(outputText);
            } catch (error) {
                showOutput("Ошибка получения истории:\n" + error.message);
            }
        }

        // --- РАБОТА С СУБТИТРАМИ ---
        async function generateSubtitles() {
            const type = document.getElementById('mediaType').value;
            const id = document.getElementById('mediaId').value;
            const loader = document.getElementById('loading-wh');

            if(!id) return alert("Введите ID файла!");

            loader.style.display = 'block';
            showOutput("Генерация субтитров (это займет время)...");
            try {
                const res = await apiCall(`/api/media/${type}/${id}/generate/subtitles`, 'POST');
                showOutput(await res.json());
            } catch (error) {
                showOutput("Ошибка генерации:\n" + error.message);
            } finally { loader.style.display = 'none'; }
        }

        async function downloadSubtitles() {
            const type = document.getElementById('mediaType').value;
            const id = document.getElementById('mediaId').value;
            const token = document.getElementById('token').value;

            if (!token) return showOutput("Сначала войдите в систему!");
            if (!id) return alert("Введите ID файла!");

            showOutput("Подготовка файла .srt к скачиванию...");
            try {
                const res = await fetch(`/api/media/${type}/${id}/subtitles`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error(JSON.stringify(await res.json(), null, 2));

                const blob = await res.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = `${type}_${id}_subtitles.srt`;
                document.body.appendChild(a);
                a.click();

                window.URL.revokeObjectURL(downloadUrl);
                a.remove();
                showOutput("Файл субтитров (.srt) успешно скачан!");
            } catch (error) {
                showOutput("Ошибка при скачивании .srt:\n" + error.message);
            }
        }

        // --- ПРОСМОТР / ПЛЕЕР ---
        async function loadMedia() {
            const type = document.getElementById('mediaType').value;
            const id = document.getElementById('mediaId').value;
            const token = document.getElementById('token').value;
            const player = document.getElementById('player');
            const loader = document.getElementById('loading-wh');

            if (!token) return showOutput("Сначала войдите в систему!");
            if (!id) return alert("Введите ID файла!");

            player.style.display = 'none';
            loader.style.display = 'block';
            showOutput(`Загрузка ${type}...`);

            try {
                player.innerHTML = ''; // Очистка старых дорожек

                const mediaRes = await fetch(`/api/media/${type}/${id}/file`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!mediaRes.ok) throw new Error(JSON.stringify(await mediaRes.json(), null, 2));

                const mediaBlob = await mediaRes.blob();
                player.src = URL.createObjectURL(mediaBlob);

                // Пытаемся подгрузить субтитры
                try {
                    const subRes = await fetch(`/api/media/${type}/${id}/subtitles`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (subRes.ok) {
                        const srtText = await subRes.text();
                        const vttText = "WEBVTT\n\n" + srtText.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
                        const vttBlob = new Blob([vttText], { type: 'text/vtt' });

                        const track = document.createElement('track');
                        track.kind = 'subtitles';
                        track.label = 'Субтитры';
                        track.srclang = 'ru';
                        track.src = URL.createObjectURL(vttBlob);
                        track.default = true;
                        player.appendChild(track);
                        showOutput(`Медиа загружено. Субтитры подключены!`);
                    } else {
                        showOutput(`Медиа загружено (без субтитров).`);
                    }
                } catch (e) {
                    showOutput(`Медиа загружено.`);
                }

                player.style.display = 'block';
            } catch (error) {
                showOutput("Ошибка плеера:\n" + error.message);
            } finally { loader.style.display = 'none'; }
        }

        // --- УДАЛЕНИЕ ---
        async function deleteMedia() {
            const type = document.getElementById('mediaType').value;
            const id = document.getElementById('mediaId').value;

            if (!id) return alert("Введите ID файла для удаления!");

            if (!confirm(`Удалить навсегда ${type} с ID ${id} и его субтитры?`)) return;

            showOutput("Удаление...");
            try {
                const res = await apiCall(`/api/media/${type}/${id}`, 'DELETE');
                const data = await res.json();
                showOutput(data.message);

                // Скрываем плеер если удалили текущее видео
                const player = document.getElementById('player');
                player.pause();
                player.removeAttribute('src');
                player.innerHTML = '';
                player.style.display = 'none';
            } catch (error) {
                showOutput("Ошибка при удалении:\n" + error.message);
            }
        }
    </script>
</body>
</html>
